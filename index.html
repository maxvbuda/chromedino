<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dino Runner</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #game-wrap {
    text-align: center;
    user-select: none;
  }
  canvas {
    image-rendering: pixelated;
    touch-action: manipulation;
    cursor: default;
  }
</style>
</head>
<body>
<div id="game-wrap">
  <canvas id="game" width="600" height="150"></canvas>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const W = canvas.width, H = canvas.height;
const UNIT = 2;
const GROUND_Y = 140; // px where feet/obstacles touch the ground

// ---------- palette ----------
const DAY = { bg: '#fff', fg: '#535353' };
const NIGHT = { bg: '#0b0b0b', fg: '#e9e9e9' };
let invert = false;
let invertTimer = 0;
const INVERT_DISTANCE = 700;
const INVERT_DURATION_FRAMES = 700;

// ---------- dino: sprite sheet (own art), chroma-keyed and sliced at runtime ----------
// bird stays hand-drawn (unit grid rectangles) -- no bird art was supplied
const BIRD_A = [ [7,5,5,3],[11,4,3,2],[14,5,2,1],[0,2,7,3],[12,2,6,3],[4,8,2,2],[7,8,2,2] ];
const BIRD_B = [ [7,5,5,3],[11,4,3,2],[14,5,2,1],[0,7,7,3],[12,7,6,3],[4,8,2,2],[7,8,2,2] ];
const BIRD_W = 18 * UNIT, BIRD_H = 11 * UNIT;

function drawUnits(rects, ox, oy, color) {
  ctx.fillStyle = color;
  for (const [x,y,w,h] of rects) ctx.fillRect(ox + x * UNIT, oy + y * UNIT, w * UNIT, h * UNIT);
}

// ---------- sprite sheet loading: chroma-key the magenta background out,
// then trim each grid cell to its actual content so frames sit flush ----------
function chromaKeyCanvas(img) {
  const off = document.createElement('canvas');
  off.width = img.naturalWidth; off.height = img.naturalHeight;
  const octx = off.getContext('2d');
  octx.drawImage(img, 0, 0);
  const id = octx.getImageData(0, 0, off.width, off.height);
  const d = id.data;
  const kr = d[0], kg = d[1], kb = d[2];
  const tol = 60;
  for (let i = 0; i < d.length; i += 4) {
    if (Math.abs(d[i] - kr) < tol && Math.abs(d[i+1] - kg) < tol && Math.abs(d[i+2] - kb) < tol) d[i+3] = 0;
  }
  octx.putImageData(id, 0, 0);
  return off;
}
// Find every connected blob of non-transparent pixels in a cell and return
// the biggest one's bounds + membership mask. The sheet's grid isn't pixel-
// perfect (AI-generated art), so a plain per-cell bounding box sometimes
// grabs a sliver of the neighboring frame -- keeping only the largest
// connected component discards that stray fragment instead of just cropping
// around it.
function largestComponent(data, w, h) {
  const visited = new Uint8Array(w * h);
  const stack = new Int32Array(w * h);
  let best = null;
  for (let sy = 0; sy < h; sy++) {
    for (let sx = 0; sx < w; sx++) {
      const sidx = sy * w + sx;
      if (visited[sidx]) continue;
      if (data[sidx * 4 + 3] <= 10) { visited[sidx] = 1; continue; }
      let sp = 0;
      stack[sp++] = sidx; visited[sidx] = 1;
      let minX = sx, maxX = sx, minY = sy, maxY = sy, count = 0;
      while (sp > 0) {
        const idx = stack[--sp];
        const y = (idx / w) | 0, x = idx - y * w;
        count++;
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
        if (x > 0) { const n = idx - 1; if (!visited[n] && data[n*4+3] > 10) { visited[n] = 1; stack[sp++] = n; } }
        if (x < w-1) { const n = idx + 1; if (!visited[n] && data[n*4+3] > 10) { visited[n] = 1; stack[sp++] = n; } }
        if (y > 0) { const n = idx - w; if (!visited[n] && data[n*4+3] > 10) { visited[n] = 1; stack[sp++] = n; } }
        if (y < h-1) { const n = idx + w; if (!visited[n] && data[n*4+3] > 10) { visited[n] = 1; stack[sp++] = n; } }
      }
      if (!best || count > best.count) best = { seed: sidx, count, minX, minY, maxX, maxY };
    }
  }
  return best;
}
function componentMask(data, w, h, seed) {
  const mask = new Uint8Array(w * h);
  const stack = new Int32Array(w * h);
  let sp = 0;
  stack[sp++] = seed; mask[seed] = 1;
  while (sp > 0) {
    const idx = stack[--sp];
    const y = (idx / w) | 0, x = idx - y * w;
    if (x > 0) { const n = idx - 1; if (!mask[n] && data[n*4+3] > 10) { mask[n] = 1; stack[sp++] = n; } }
    if (x < w-1) { const n = idx + 1; if (!mask[n] && data[n*4+3] > 10) { mask[n] = 1; stack[sp++] = n; } }
    if (y > 0) { const n = idx - w; if (!mask[n] && data[n*4+3] > 10) { mask[n] = 1; stack[sp++] = n; } }
    if (y < h-1) { const n = idx + w; if (!mask[n] && data[n*4+3] > 10) { mask[n] = 1; stack[sp++] = n; } }
  }
  return mask;
}
function sliceFrames(sheetCanvas, cols, rows) {
  const cellW = sheetCanvas.width / cols, cellH = sheetCanvas.height / rows;
  const sctx = sheetCanvas.getContext('2d');
  const frames = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const rx = Math.floor(c * cellW), ry = Math.floor(r * cellH);
      const rw = Math.ceil(cellW), rh = Math.ceil(cellH);
      const id = sctx.getImageData(rx, ry, rw, rh);
      const d = id.data;
      const comp = largestComponent(d, rw, rh);
      if (!comp) { frames.push(null); continue; }
      const mask = componentMask(d, rw, rh, comp.seed);
      const fw = comp.maxX - comp.minX + 1, fh = comp.maxY - comp.minY + 1;
      const out = new ImageData(fw, fh);
      const od = out.data;
      for (let y = 0; y < fh; y++) {
        for (let x = 0; x < fw; x++) {
          const srcIdx = (y + comp.minY) * rw + (x + comp.minX);
          if (!mask[srcIdx]) continue;
          const s = srcIdx * 4, o = (y * fw + x) * 4;
          od[o] = d[s]; od[o+1] = d[s+1]; od[o+2] = d[s+2]; od[o+3] = d[s+3];
        }
      }
      const fc = document.createElement('canvas');
      fc.width = fw; fc.height = fh;
      fc.getContext('2d').putImageData(out, 0, 0);
      frames.push(fc);
    }
  }
  return frames;
}
function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

let raptorFrames = null, cactusFrames = null, assetsReady = false;
const RUN_FRAMES = [0, 1, 2, 4, 5, 6]; // 8-frame sheet minus the jump pose (3) and game-over pose (7)
const RAPTOR_IDLE = 0, RAPTOR_JUMP = 3, RAPTOR_GAMEOVER = 7;
const DINO_TARGET_H = 50;
const DINO_COLLISION_W = 60, DINO_COLLISION_H = 46;
const DINO_DUCK_COLLISION_W = 66, DINO_DUCK_COLLISION_H = 26;

// ---------- physics (matched to the real game's feel; numbers are unprotectable facts) ----------
const GRAVITY = 0.6;
const SPEED_START = 6;
const SPEED_MAX = 13;
const ACCEL_PER_FRAME = 0.001;
const SPEED_DROP_MULT = 3;

let speed = SPEED_START;
let running = false;
let gameOver = false;
let started = false;
let score = 0;
let highScore = Number(localStorage.getItem('dino-high-score') || 0);
let flashTimer = 0;
let frame = 0;
let groundSeed = [];
let groundOffset = 0;
let cloudList = [];

const dino = { x: 30, y: 0, vy: 0, ducking: false, speedDrop: false, legFrame: 0 };

function dinoDims(ducking) { return ducking ? [DINO_DUCK_COLLISION_W, DINO_DUCK_COLLISION_H] : [DINO_COLLISION_W, DINO_COLLISION_H]; }
function dinoTopY(ducking) { const [, h] = dinoDims(ducking); return GROUND_Y - h; }
function resetDino() {
  dino.y = dinoTopY(false);
  dino.vy = 0;
  dino.ducking = false;
  dino.speedDrop = false;
  dino.legFrame = 0;
}

let obstacles = [];
let nextObstacleFrame = 0;
function scheduleNextObstacle() {
  // Keep the frame-gap comfortably above a full jump arc (~35 frames) so
  // there's always time to react, tightening slightly as speed ramps up.
  const base = 70 + Math.random() * 50;
  const tighten = (speed - SPEED_START) * 1.5;
  nextObstacleFrame = frame + Math.max(50, base - tighten);
}
function pushCactus(x) {
  const idx = Math.floor(Math.random() * cactusFrames.length);
  const spr = cactusFrames[idx];
  if (!spr) return null;
  const targetH = 34 + Math.random() * 20; // 34-54px: small-to-large variety
  const maxW = 30; // some variants (round barrel, prickly-pear cluster) are wider than tall
  const scale = Math.min(targetH / spr.height, maxW / spr.width);
  const w = spr.width * scale, h = spr.height * scale;
  const o = { type: 'cactus', x, frameIdx: idx, w, h };
  obstacles.push(o);
  return o;
}
function spawnObstacle() {
  const canBird = score > 200;
  if (canBird && Math.random() < 0.35) {
    const lanes = [GROUND_Y - BIRD_H, GROUND_Y - BIRD_H - 25, GROUND_Y - BIRD_H - 50];
    const y = lanes[Math.floor(Math.random() * lanes.length)];
    obstacles.push({ type: 'bird', x: W + 10, y, wing: 0 });
  } else {
    const first = pushCactus(W + 10);
    if (first && Math.random() < 0.2) pushCactus(first.x + first.w + 2);
  }
}

function initGround() {
  groundSeed = [];
  for (let x = 0; x < W * 3; x += 3) {
    if (Math.random() < 0.06) groundSeed.push({ x, w: 1 + Math.floor(Math.random() * 3), thin: Math.random() < 0.5 });
  }
  cloudList = [];
  for (let i = 0; i < 3; i++) cloudList.push({ x: Math.random() * W, y: 20 + Math.random() * 40 });
}

function resetGame() {
  obstacles = [];
  score = 0;
  frame = 0;
  speed = SPEED_START;
  groundOffset = 0;
  gameOver = false;
  invert = false;
  invertTimer = 0;
  flashTimer = 0;
  resetDino();
  scheduleNextObstacle();
  initGround();
}

// ---------- tiny synthesized sound effects (no sampled audio) ----------
let actx = null;
function tone(freq, dur, type = 'square', vol = 0.05) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.value = vol;
    osc.connect(gain).connect(actx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    osc.stop(actx.currentTime + dur);
  } catch (e) { /* audio not available */ }
}
const sndJump = () => tone(220, 0.08);
const sndHit = () => tone(110, 0.25, 'sawtooth', 0.08);
const sndScore = () => tone(880, 0.06, 'square', 0.04);

function jump() {
  if (!started) { started = true; running = true; resetGame(); return; }
  if (gameOver) { resetGame(); running = true; return; }
  if (dino.y >= dinoTopY(dino.ducking) - 1 && dino.vy === 0) {
    dino.vy = -(10 + speed / 10);
    dino.speedDrop = false;
    sndJump();
  }
}
function duck(state) {
  if (dino.vy !== 0) {
    if (state) dino.speedDrop = true;
    return;
  }
  if (state && !dino.ducking) { dino.ducking = true; dino.y = dinoTopY(true); }
  else if (!state && dino.ducking) { dino.ducking = false; dino.y = dinoTopY(false); }
}

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
  else if (e.code === 'ArrowDown') { e.preventDefault(); duck(true); }
  else if (e.code === 'Enter' && gameOver) { jump(); }
});
document.addEventListener('keyup', (e) => { if (e.code === 'ArrowDown') { duck(false); dino.speedDrop = false; } });
canvas.addEventListener('pointerdown', jump);

function overlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function update() {
  if (!running) return;
  frame++;
  score += 0.15;
  if (speed < SPEED_MAX) speed += ACCEL_PER_FRAME;

  if (invertTimer > 0) {
    invertTimer--;
    if (invertTimer === 0) invert = false;
  } else if (Math.floor(score) > 0 && Math.floor(score) % INVERT_DISTANCE === 0 && Math.floor(score - 0.15) % INVERT_DISTANCE !== 0) {
    invert = true;
    invertTimer = INVERT_DURATION_FRAMES;
  }
  if (Math.floor(score) > 0 && Math.floor(score) % 100 === 0 && Math.floor(score - 0.15) % 100 !== 0) {
    flashTimer = 20;
    sndScore();
  }
  if (flashTimer > 0) flashTimer--;

  const fallMult = dino.speedDrop ? SPEED_DROP_MULT : 1;
  dino.vy += GRAVITY * fallMult;
  dino.y += dino.vy;
  const floor = dinoTopY(dino.ducking);
  if (dino.y > floor) { dino.y = floor; dino.vy = 0; dino.speedDrop = false; }
  dino.legFrame++;

  groundOffset -= speed;
  if (groundOffset <= -W) groundOffset += W;

  for (const c of cloudList) {
    c.x -= speed * 0.2;
    if (c.x < -60) { c.x = W + Math.random() * 40; c.y = 20 + Math.random() * 40; }
  }

  if (frame >= nextObstacleFrame) { spawnObstacle(); scheduleNextObstacle(); }
  for (const o of obstacles) { o.x -= speed; if (o.type === 'bird') o.wing++; }
  obstacles = obstacles.filter(o => o.x > -60);

  const [dw, dh] = dinoDims(dino.ducking);
  const pad = 5;
  for (const o of obstacles) {
    let ow, oh, ox, oy;
    if (o.type === 'bird') { ow = BIRD_W; oh = BIRD_H; ox = o.x; oy = o.y; }
    else { ow = o.w; oh = o.h; ox = o.x; oy = GROUND_Y - o.h; }
    if (overlap(dino.x + pad, dino.y + pad, dw - pad*2, dh - pad*2, ox + pad, oy + pad, ow - pad*2, oh - pad*2)) {
      running = false;
      gameOver = true;
      sndHit();
      if (score > highScore) { highScore = Math.floor(score); localStorage.setItem('dino-high-score', highScore); }
    }
  }
}

// ---------- own dot-matrix font for the score ----------
const DIGITS = {
  '0': ['111','101','101','101','111'], '1': ['010','110','010','010','111'],
  '2': ['111','001','111','100','111'], '3': ['111','001','111','001','111'],
  '4': ['101','101','111','001','001'], '5': ['111','100','111','001','111'],
  '6': ['111','100','111','101','111'], '7': ['111','001','010','010','010'],
  '8': ['111','101','111','101','111'], '9': ['111','101','111','001','111'],
  'H': ['101','101','111','101','101'], 'I': ['111','010','010','010','111'],
};
function drawDigits(str, rightX, topY, color, scale) {
  ctx.fillStyle = color;
  let x = rightX - str.length * (4 * scale);
  for (const ch of str) {
    const glyph = DIGITS[ch];
    if (glyph) {
      for (let r = 0; r < 5; r++) for (let c = 0; c < 3; c++) {
        if (glyph[r][c] === '1') ctx.fillRect(x + c*scale, topY + r*scale, scale, scale);
      }
    }
    x += 4 * scale;
  }
}

const LETTERS = {
  G: ['11111','10000','10011','10001','11111'], A: ['01110','10001','11111','10001','10001'],
  M: ['10001','11011','10101','10001','10001'], E: ['11111','10000','11110','10000','11111'],
  O: ['01110','10001','10001','10001','01110'], V: ['10001','10001','10001','01010','00100'],
  R: ['11110','10001','11110','10100','10010'], ' ': ['000','000','000','000','000'],
};
function drawText(str, cx, topY, color, scale) {
  const widths = [...str].map(ch => (LETTERS[ch] ? LETTERS[ch][0].length : 3) + 1);
  const total = widths.reduce((a,b)=>a+b,0) * scale;
  let x = cx - total / 2;
  ctx.fillStyle = color;
  for (const ch of str) {
    const glyph = LETTERS[ch] || LETTERS[' '];
    const w = glyph[0].length;
    for (let r = 0; r < glyph.length; r++) for (let c = 0; c < w; c++) {
      if (glyph[r][c] === '1') ctx.fillRect(x + c*scale, topY + r*scale, scale, scale);
    }
    x += (w + 1) * scale;
  }
}

function drawReplayIcon(cx, cy, color) {
  const r = 12;
  ctx.strokeStyle = color;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0.6 * Math.PI, 2.3 * Math.PI);
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(cx + r - 2, cy + 6);
  ctx.lineTo(cx + r + 6, cy + 2);
  ctx.lineTo(cx + r - 1, cy - 4);
  ctx.closePath();
  ctx.fill();
}

function drawCloud(x, y, color) {
  ctx.fillStyle = color;
  ctx.globalAlpha = 0.6;
  ctx.fillRect(x + 4, y + 4, 22, 3);
  ctx.fillRect(x, y + 2, 11, 5);
  ctx.fillRect(x + 7, y - 2, 15, 6);
  ctx.fillRect(x + 20, y + 1, 11, 6);
  ctx.globalAlpha = 1;
}
function drawMoon(x, y, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, 14, 14);
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillRect(x + 5, y - 2, 14, 14);
  ctx.globalCompositeOperation = 'source-over';
}
function drawStars(color) {
  ctx.fillStyle = color;
  for (const [sx, sy] of [[40,20],[120,40],[220,15],[320,35],[420,20],[500,45],[560,25]]) ctx.fillRect(sx, sy, 2, 2);
}
function drawGround(color) {
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y + 1);
  ctx.lineTo(W, GROUND_Y + 1);
  ctx.stroke();
  ctx.fillStyle = color;
  for (const p of groundSeed) {
    let x = p.x + groundOffset;
    while (x < -10) x += W * 3;
    x = x % (W * 3);
    if (x < W) ctx.fillRect(x, GROUND_Y + 3, p.w, p.thin ? 1 : 2);
  }
}

function drawDino() {
  if (!assetsReady) return;
  const ducking = dino.ducking;
  const [cw, ch] = dinoDims(ducking);
  const onGround = dino.y >= dinoTopY(ducking) - 1;

  let frameIdx;
  if (gameOver) frameIdx = RAPTOR_GAMEOVER;
  else if (!running) frameIdx = RAPTOR_IDLE;
  else if (!onGround) frameIdx = RAPTOR_JUMP;
  else frameIdx = RUN_FRAMES[Math.floor(dino.legFrame / 5) % RUN_FRAMES.length];

  const spr = raptorFrames[frameIdx];
  if (!spr) return;
  const scale = DINO_TARGET_H / spr.height;
  const dw = spr.width * scale;
  const dh = ducking ? spr.height * scale * 0.55 : spr.height * scale;
  const dx = dino.x + (cw - dw) / 2;
  const dy = dino.y + (ch - dh);
  ctx.drawImage(spr, dx, dy, dw, dh);
}

function drawObstacles(color) {
  for (const o of obstacles) {
    if (o.type === 'cactus') {
      const spr = cactusFrames[o.frameIdx];
      if (spr) ctx.drawImage(spr, o.x, GROUND_Y - o.h, o.w, o.h);
    } else {
      drawUnits(Math.floor(o.wing / 8) % 2 === 0 ? BIRD_A : BIRD_B, o.x, o.y, color);
    }
  }
}

function draw() {
  const pal = invert ? NIGHT : DAY;
  ctx.fillStyle = pal.bg;
  ctx.fillRect(0, 0, W, H);

  if (invert) { drawStars(pal.fg); drawMoon(520, 18, pal.fg); }
  else { for (const c of cloudList) drawCloud(c.x, c.y, '#c0c0c0'); }

  drawGround(pal.fg);
  drawObstacles(pal.fg);
  drawDino();

  if (flashTimer === 0 || Math.floor(flashTimer / 4) % 2 === 0) {
    const hs = String(highScore).padStart(5, '0');
    const s = String(Math.floor(score)).padStart(5, '0');
    const scale = 3, digitW = 4 * scale;
    let right = W - 14;
    drawDigits(s, right, 12, pal.fg, scale);
    right -= s.length * digitW + 20;
    if (highScore > 0) {
      drawDigits(hs, right, 12, pal.fg, scale);
      right -= hs.length * digitW + 6;
      drawDigits('HI', right, 12, pal.fg, scale);
    }
  }

  if (gameOver) {
    drawText('GAME OVER', W / 2, H / 2 - 24, pal.fg, 3);
    drawReplayIcon(W / 2, H / 2 + 20, pal.fg);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

Promise.all([loadImage('assets/raptor_sheet.png'), loadImage('assets/cactus_sheet.png')])
  .then(([raptorImg, cactusImg]) => {
    raptorFrames = sliceFrames(chromaKeyCanvas(raptorImg), 4, 2);
    cactusFrames = sliceFrames(chromaKeyCanvas(cactusImg), 4, 2);
    assetsReady = true;
    initGround();
    resetDino();
    loop();
  });
</script>
</body>
</html>
